{% extends 'dash_navber.html' %}

{% block content %}
	
	<!--Main container start -->
	<main class="ttr-wrapper">
		<div class="container-fluid">
			<div class="row">
				<!-- Your Profile Views Chart -->
				<div class="col-lg-12 m-b30">
					<div class="widget-box">
						<div class="wc-title">
							<h4 class="h3 mb-0 text-gray-800">User Profile</h4>
						</div>
						<div class="widget-inner">
							<form class="edit-profile m-b30">
								<div class="">
									<div class="form-group row">
										<div class="col-sm-10  ml-auto">
											<h3 class="text-dark">1. Personal Details</h3>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">First Name</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="{{user.first_name}}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Last Name</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="{{user.last_name}}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Title</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="{{user.role}}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">School Name</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="Hamdala Science College" disabled>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Phone No.</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="{{user.profile.contact}}">
										</div>
									</div>
									
									<div class="seperator"></div>
									
									<div class="form-group row">
										<div class="col-sm-10 ml-auto">
											<h3>2. Address</h3>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Address</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="5-S2-20 Dummy City, UK">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">City</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="KANO">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">State</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="Kano State">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Postcode</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="000702">
										</div>
									</div>

									<div class="m-form__seperator m-form__seperator--dashed m-form__seperator--space-2x"></div>

									<div class="form-group row">
										<div class="col-sm-10 ml-auto">
											<h3 class="m-form__section">3. Social Links</h3>
										</div>
									</div>

									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Linkedin</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="www.linkedin.com">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Facebook</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="www.facebook.com">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Twitter</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="www.twitter.com">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-2 col-form-label">Instagram</label>
										<div class="col-sm-7">
											<input class="form-control" type="text" value="www.instagram.com">
										</div>
									</div>
								</div>
								<div class="">
									<div class="">
										<div class="row">
											<div class="col-sm-2">
											</div>
											<div class="col-sm-7">
												<button type="reset" class="btn btn-sm btn-primary shadow-sm">Save changes</button>
												<a href="{% url 'password_change' %}" type="reset" class="btn btn-sm btn-info shadow-sm">Change password</a>
											</div>
										</div>
									</div>
								</div>
							</form>
							
						</div>
					</div>
				</div>
				<!-- Your Profile Views Chart END-->
			</div>
		</div>
	</main>
	<div class="ttr-overlay"></div>
{% endblock content %}
