<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <title>
    {% block title %}
        
    {% endblock title %}
        </title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">   
    
</head>
  <body>
      <!-- Preloader -->
<div id="preloader" class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex justify-content-center align-items-center" style="z-index: 1050;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
    <main>
          <section class="sign-in-form pt-5 pb-5">
            <div class="container">
              
              <div class="col-lg-5 col-12 mt-3  mx-auto">
                {% include 'components/message.html' %}
                <div class="card border-0">
                  <div class="card-header bg-secondary text-center p-4">
                            <h1 class="m-0 text-white">Add Student</h1>
                        </div>
                        <div class="card-body rounded-bottom p-3 bg-primary" >
                            <form method="post" >
                              {% csrf_token %}
                              <div>
                                <div class="form-floating mb-3">
    <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" pattern="[^ @]*@[^ @]*">
    <label for="email">Parent Email Info</label>
  </div>
  <div class="form-floating mb-3">
                                  <input type="text" name="stu_name" id="stu_name" class="form-control" placeholder="Full Name" required="required" />
                                  <label for="stu_name">Student Name</label>
                                </div>
                                <div class="mb-3">
      <label for="stu_section" class="form-label mb-1"><b>Section:</b></label>
      <select name="stu_section" class="form-select" id="stu_section">
        
        {% if user.role == "p_principal" %}
        <option value="prm_sec">Primary</option>
        {% else %}
        <option value="sec_sec">Secondary</option>
        {% endif %}
            
      </select>
    </div>
    <div class="mb-3">
      <label for="stu_class" class="form-label mb-1"><b>Class:</b></label>
      <select name="stu_class" class="form-select" id="stu_class">
        {% if user.role == "p_principal" %}
        <option value="nus1">NURSERY 1</option>
        <option value="nus2">NURSERY 2</option>
        <option value="prm1">PRIMARY 1</option>
        <option value="prm2">PRIMARY 2</option>
        <option value="prm3">PRIMARY 3</option>
        <option value="prm4">PRIMARY 4</option>
        <option value="prm5">PRIMARY 5</option>
        {% else %}
        <option value="jss1">JSS 1</option>
        <option value="jss2">JSS 2</option>
        <option value="jss3">JSS 3</option>
        <option value="sss1">SSS 1</option>
        <option value="sss2">SSS 2</option>
        <option value="sss3">SSS 3</option>
        {% endif %}
      </select>
    </div>
    <div class="mb-3">
      <label for="stu_grade" class="form-label mb-1"><b>Grade:</b></label>
      <select name="stu_grade" class="form-select" id="stu_grade">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
    </div>
</div>
                               
                                <div class="d-grid gap-2">
                                  <button class="btn btn-lg btn-dark" type="submit">Add Student</button>
                                </div>
                            </form><br>
                           
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
          </section>
        </main>
      </div>
 <!-- JavaScript: force preloader for 3 seconds -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      const preloader = document.getElementById("preloader");
      if (preloader) {
        preloader.remove(); // Removes the preloader after 3s
      }
    }, 2000); // 2000 milliseconds = 2 seconds
  });
</script>
        <script src="{% static 'js/bootstrap.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
</body>

</html>
