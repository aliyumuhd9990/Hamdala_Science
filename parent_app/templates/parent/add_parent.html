{% extends 'dash_navber.html' %}
{% block title %}Add Parent{% endblock %}

{% block content %}
<div class="card shadow container" style="margin-top: 5em;">
    <div >
        <h5 class="text-primary fw-bolder text-center pt-3">Add Parent / Guardian</h5>
    </div>
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col">
                    <label>First Name</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="col">
                    <label>Last Name</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control" rows="3"></textarea>
            </div>
<div class="d-grid gap-2">
    <button type="submit" class="btn btn-primary">
        Save Parent
    </button>
</div>

        </form>

    </div>
</div>
{% endblock %}
